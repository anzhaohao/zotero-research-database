<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zotero Research Database · 风格选择</title>
    <style>
      :root {
        font-family:
          "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
        color: #1e2935;
        background: #eef2f5;
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        margin: 0;
        padding: 56px 28px;
        background:
          radial-gradient(
            circle at 15% 0,
            rgba(114, 177, 225, 0.2),
            transparent 33%
          ),
          radial-gradient(
            circle at 85% 5%,
            rgba(167, 142, 220, 0.16),
            transparent 29%
          ),
          #eef2f5;
      }
      main {
        width: min(1120px, 100%);
        margin: auto;
      }
      header {
        max-width: 760px;
        margin-bottom: 34px;
      }
      h1 {
        margin: 0;
        font-size: clamp(27px, 4vw, 42px);
        letter-spacing: -0.035em;
        line-height: 1.2;
      }
      p {
        margin: 13px 0 0;
        color: #657381;
        line-height: 1.8;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 18px;
      }
      a {
        min-height: 270px;
        padding: 24px;
        border: 1px solid rgba(35, 57, 74, 0.11);
        border-radius: 18px;
        color: inherit;
        text-decoration: none;
        background: rgba(255, 255, 255, 0.78);
        box-shadow: 0 15px 45px rgba(32, 56, 73, 0.08);
        transition:
          transform 220ms cubic-bezier(0.22, 1, 0.36, 1),
          box-shadow 220ms ease,
          border-color 180ms ease;
      }
      a:hover {
        border-color: rgba(30, 105, 158, 0.28);
        box-shadow: 0 22px 60px rgba(32, 56, 73, 0.14);
        transform: translateY(-4px);
      }
      .swatch {
        height: 86px;
        margin-bottom: 22px;
        border-radius: 12px;
        box-shadow: inset 0 0 0 1px rgba(20, 40, 55, 0.08);
      }
      .notion {
        background: linear-gradient(135deg, #fff 0 54%, #f3f3f1 54%);
      }
      .apple {
        background:
          radial-gradient(circle at 30% 30%, #fff, transparent 28%),
          linear-gradient(135deg, #cfe6fa, #e2d8f5 52%, #ccebe6);
      }
      .academic {
        background: linear-gradient(
          135deg,
          #123f58 0 26%,
          #edf4f6 26% 72%,
          #fff 72%
        );
      }
      h2 {
        margin: 0 0 8px;
        font-size: 19px;
      }
      small {
        display: block;
        color: #71808c;
        line-height: 1.7;
      }
      .tag {
        display: inline-block;
        margin-top: 17px;
        padding: 4px 9px;
        border-radius: 99px;
        color: #2b698f;
        background: #eaf3f8;
        font-size: 11px;
        font-weight: 700;
      }
      @media (max-width: 860px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        a {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Zotero Research Database<br />视觉与动效原型</h1>
        <p>
          三版使用同一套数据和交互。进入后可以打开三个组合菜单、横向滚动、切换暗夜模式、选择固定列；单击任意格子会选择整列，双击才激活单元格并显示编辑、复制和填色按钮。
        </p>
      </header>
      <section class="grid">
        <a href="notion-calm.html">
          <div class="swatch notion"></div>
          <h2>A · Notion 清爽</h2>
          <small>扁平、克制、信息优先。边界轻，长时间阅读最安静。</small>
          <span class="tag">最接近 Notion</span>
        </a>
        <a href="apple-glass.html">
          <div class="swatch apple"></div>
          <h2>B · Apple 玻璃</h2>
          <small>半透明材质、柔和深度、短促且可中断的状态反馈。</small>
          <span class="tag">动效最明显</span>
        </a>
        <a href="academic-studio.html">
          <div class="swatch academic"></div>
          <h2>C · 学术工作台</h2>
          <small>专业蓝灰、高对比表头、兼顾信息密度与论文阅读。</small>
          <span class="tag">平衡方案</span>
        </a>
      </section>
    </main>
  </body>
</html>
